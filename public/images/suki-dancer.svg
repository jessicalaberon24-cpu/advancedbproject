<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
<style>
  .bounce { animation: bounce 0.7s ease-in-out infinite; }
  .sway { transform-box: view-box; transform-origin: 60px 150px; animation: sway 1.4s ease-in-out infinite; }
  .armL { transform-box: view-box; transform-origin: 44px 102px; animation: waveL 0.7s ease-in-out infinite; }
  .armR { transform-box: view-box; transform-origin: 76px 102px; animation: waveR 0.7s ease-in-out infinite; }
  .tailL { transform-box: view-box; transform-origin: 30px 62px; animation: tailL 0.7s ease-in-out infinite; }
  .tailR { transform-box: view-box; transform-origin: 90px 62px; animation: tailR 0.7s ease-in-out infinite; }
  .screen { animation: blink 0.7s steps(2) infinite; }
  .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 1.2s ease-in-out infinite; }
  .s2 { animation-delay: 0.4s; }
  .s3 { animation-delay: 0.8s; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes waveL { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(20deg); } }
  @keyframes waveR { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-20deg); } }
  @keyframes tailL { 0%,100% { transform: rotate(6deg); } 50% { transform: rotate(-8deg); } }
  @keyframes tailR { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
  @keyframes blink { 0% { fill: #5ad1ff; } 100% { fill: #ff9ccf; } }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(1.2); } }
</style>

<g class="bounce"><g class="sway">

  <g class="tailL"><ellipse cx="22" cy="88" rx="11" ry="26" fill="#5b2a86"/></g>
  <g class="tailR"><ellipse cx="98" cy="88" rx="11" ry="26" fill="#5b2a86"/></g>

  <ellipse cx="60" cy="58" rx="34" ry="36" fill="#5b2a86"/>

  <rect x="47" y="132" width="8" height="16" rx="3" fill="#ffe0cf"/>
  <rect x="65" y="132" width="8" height="16" rx="3" fill="#ffe0cf"/>
  <ellipse cx="50" cy="150" rx="8" ry="4" fill="#7c2cff"/>
  <ellipse cx="70" cy="150" rx="8" ry="4" fill="#7c2cff"/>

  <path d="M44 98 L76 98 L88 136 L32 136 Z" fill="#ff4fa3"/>
  <path d="M32 136 L88 136 L86 130 L34 130 Z" fill="#ff8cc6"/>
  <rect x="44" y="96" width="32" height="6" fill="#7c2cff"/>

  <g class="armL">
    <path d="M44 102 L22 82" stroke="#ffe0cf" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="21" cy="80" r="5" fill="#ffe0cf"/>
  </g>

  <ellipse cx="60" cy="64" rx="28" ry="27" fill="#ffe0cf"/>

  <path d="M32 62 Q34 30 60 30 Q86 30 88 62 Q80 44 66 46 Q60 54 52 46 Q38 44 32 62 Z" fill="#5b2a86"/>

  <ellipse cx="49" cy="68" rx="5.5" ry="8" fill="#2b1b4d"/>
  <ellipse cx="71" cy="68" rx="5.5" ry="8" fill="#2b1b4d"/>
  <circle cx="51" cy="65" r="2.2" fill="#fff"/>
  <circle cx="73" cy="65" r="2.2" fill="#fff"/>
  <circle cx="47.5" cy="71" r="1.1" fill="#fff"/>
  <circle cx="69.5" cy="71" r="1.1" fill="#fff"/>

  <ellipse cx="41" cy="78" rx="5" ry="3" fill="#ff7ab8" opacity="0.6"/>
  <ellipse cx="79" cy="78" rx="5" ry="3" fill="#ff7ab8" opacity="0.6"/>
  <path d="M53 78 Q60 90 67 78 Z" fill="#d6336c"/>

  <path d="M26 58 L14 52 L16 66 Z" fill="#ff4fa3"/>
  <path d="M26 58 L38 52 L36 66 Z" fill="#ff4fa3"/>
  <path d="M94 58 L106 52 L104 66 Z" fill="#ff4fa3"/>
  <path d="M94 58 L82 52 L84 66 Z" fill="#ff4fa3"/>

  <g class="armR">
    <path d="M76 102 L96 84" stroke="#ffe0cf" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="90" y="50" width="18" height="32" rx="4" fill="#1f1f3a"/>
    <rect x="92.5" y="54" width="13" height="23" rx="2" class="screen" fill="#5ad1ff"/>
    <circle cx="97" cy="84" r="5" fill="#ffe0cf"/>
  </g>

</g></g>

<path class="spark" d="M10 24 L12 30 L18 32 L12 34 L10 40 L8 34 L2 32 L8 30 Z" fill="#ffc400"/>
