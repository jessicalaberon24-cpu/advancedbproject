<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Payment Failed - BudgetPhone.ph — Laberon Shop 📱
    </title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #ffc1dc,
                    #bdefff
                );
        }

        .failure-box {
            width: 90%;
            max-width: 450px;
            padding: 35px;
            background: white;
            border-radius: 25px;
            text-align: center;
            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.18);
        }

        .failure-box h1 {
            color: #e91e63;
            margin-bottom: 15px;
        }

        .failure-box p {
            font-size: 17px;
            margin-bottom: 25px;
        }

        .failure-box button {
            padding: 13px 25px;
            border: none;
            border-radius: 12px;
            background: #e91e63;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="failure-box">

        <h1>
            Payment Failed ❌
        </h1>

        <p>
            Your Maya payment was not completed.
            Please try again.
        </p>

        <button
            onclick="goBack()"
        >
            Back to Shop
        </button>

    </div>


    <script>

        function goBack() {

            window.location.href = "/";

        }

    </script>

</body>

</html>
